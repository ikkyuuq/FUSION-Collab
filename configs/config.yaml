# Training configuration
training:
  checkpoints_dir: 'ckpts'
  batch_size: 12
  learning_rate_g: 2.0e-04
  end_epoch: 1000
  img_extension: '.png'
  image_size: 512
  beta1: 0.5
  beta2: 0.999
  wd_g: 0.00005
  wd_d: 0.00000
  lambda_mse: 1.0
  lambda_vgg: 0.02

# Dataset paths
dataset:
  train:
    EUVP:
      raw: '/content/data/FUSION/EUVP/raw'
      reference: '/content/data/FUSION/EUVP/ref'
    SUIM-E:
      raw: '/content/data/FUSION/SUIM-E/raw'
      reference: '/content/data/FUSION/SUIM-E/raw'
    UIEB:
      raw: '/content/data/FUSION/UIEB/raw'
      reference: '/content/data/FUSION/UIEB/ref'
  test:
    inp_dir: "/path/to/test/Inp"
    gt_dir: "/path/to/test/GTr"
    mode: "Nat"  # Testing mode
    start: 1  # Testing start
    end: 1   # Testing end

# Model configuration
model:
  in_channels: 3
  out_channels: 3
  kernel_sizes: [3, 5, 7]  # For R, G, B channels
  reduction_ratio: 16
  pool_types: ['avg', 'max']
  
